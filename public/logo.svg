<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gradFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7A59"/>
      <stop offset="100%" stop-color="#FF3815"/>
    </linearGradient>
    <linearGradient id="gradGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5E6CA"/>
      <stop offset="100%" stop-color="#F4A261"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sleek rounded dark container -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#131720" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>
  
  <!-- Outer subtle circular motion ring -->
  <circle cx="50" cy="50" r="34" fill="none" stroke="url(#gradGold)" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.4"/>
  
  <!-- Dynamic Dancer arabesque ribbon / swoosh -->
  <path d="M 28 68 C 30 40, 48 24, 68 26 C 60 40, 52 52, 44 72" fill="none" stroke="url(#gradFlame)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
  
  <!-- Poised head / glowing ember -->
  <circle cx="68" cy="27" r="5.5" fill="#FFFFFF" filter="url(#glow)"/>
  <circle cx="68" cy="27" r="3" fill="#FF5E36"/>

  <!-- Flowing lower veil swoop -->
  <path d="M 36 58 Q 50 44, 72 49" fill="none" stroke="url(#gradGold)" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
</svg>
